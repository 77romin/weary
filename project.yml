name: WEARy
options:
  bundleIdPrefix: com.weary
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  CloudKitDebug: debug
  Release: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: NSFKUQF8TG
    CODE_SIGN_STYLE: Automatic
targets:
  WEARy:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Supabase.xcconfig
      CloudKitDebug: Config/Supabase.xcconfig
      Release: Config/Supabase.xcconfig
    sources:
      - path: WEARy
        excludes:
          - Resources
          - WEARy.entitlements
      - path: WEARy/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weary.prototype
        PRODUCT_NAME: WEARy
        INFOPLIST_FILE: Config/WEARy-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        CloudKitDebug:
          CODE_SIGN_ENTITLEMENTS: WEARy/WEARy.entitlements
    scheme:
      testTargets:
        - WEARyTests
        - WEARyUITests
    dependencies:
      - package: Supabase
  WEARyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WEARyTests
    dependencies:
      - target: WEARy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weary.prototype.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WEARy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WEARy"
        BUNDLE_LOADER: "$(TEST_HOST)"
  WEARyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WEARyUITests
    dependencies:
      - target: WEARy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weary.prototype.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WEARy-CloudKit:
    build:
      targets:
        WEARy: all
    run:
      config: CloudKitDebug
    test:
      config: CloudKitDebug
      targets:
        - WEARyTests
        - WEARyUITests

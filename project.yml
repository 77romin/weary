name: WEARy
options:
  bundleIdPrefix: com.weary
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  WEARy:
    type: application
    platform: iOS
    sources:
      - path: WEARy
        excludes:
          - Resources
    resources:
      - path: WEARy/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weary.prototype
        PRODUCT_NAME: WEARy
        INFOPLIST_KEY_CFBundleDisplayName: WEARy
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 착장과 옷 사진을 등록하기 위해 사진 보관함 접근이 필요합니다.
        INFOPLIST_KEY_NSCameraUsageDescription: 오늘의 착장과 옷을 촬영하기 위해 카메라 접근이 필요합니다.
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - WEARyTests
  WEARyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WEARyTests
    dependencies:
      - target: WEARy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weary.prototype.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WEARy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WEARy"
        BUNDLE_LOADER: "$(TEST_HOST)"
